[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complibot"
version = "0.1.0"
description = "An evaluated RAG + agent assistant for Singapore regulatory compliance questions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=4.0",
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.0"]
openai = ["openai>=1.40"]
agent = ["langgraph>=0.2"]
guardrails = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
tracing = ["langfuse>=3.0"]
rerank = ["sentence-transformers>=3.0"]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
complibot = "complibot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B008"]  # B008: FastAPI's Depends()/Header() defaults are idiomatic
